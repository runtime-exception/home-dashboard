version: 3

dashboard:
  title: Tools Center
  description: 统一管理和访问个人部署工具
  adminEntry: false

search:
  defaultEngine: bing
  engines:
    - id: baidu
      name: 百度
      urlTemplate: https://www.baidu.com/s?wd={query}
      enabled: true
    - id: bing
      name: 必应
      urlTemplate: https://www.bing.com/search?q={query}
      enabled: true
    - id: google
      name: Google
      urlTemplate: https://www.google.com/search?q={query}
      enabled: true

networkTest:
  ip: 192.168.28.30
  port: 8019
  protocol: http
  timeoutMs: 3000

# 标签注册表：工具的 tags 字段引用这里的 id。
# id 一经使用尽量不要修改，改名只改 label 即可。
tags:
  - id: docs
    label: 文档处理
  - id: media
    label: 影音媒体
  - id: devops
    label: 运维部署
  - id: ai
    label: AI 工具
  - id: storage
    label: 文件存储
  - id: notes
    label: 笔记知识

tools:
  - id: pdf
    title: PDF Tools
    description: PDF 合并、拆分、压缩与格式转换，一站式处理常用文档任务。
    icon: http://192.168.28.30:8019/images/favicon.svg
    internalUrl: http://192.168.28.30:8019
    publicUrl: https://pdf.pixellife.fun
    accent: "#f06b78"
    enabled: true
    tags:
      - docs

  - id: converter
    title: ConvertX
    description: 快速转换图片、文档、音视频等多种文件格式。
    icon: http://192.168.28.30:8020/favicon-32x32.png
    internalUrl: http://192.168.28.30:8020
    publicUrl: https://convert.pixellife.fun
    accent: "#f0b44e"
