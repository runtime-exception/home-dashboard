name: docker-tools-dashboard

services:
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    restart: unless-stopped
    ports:
      - "${DASHBOARD_PORT:-8080}:80"
    volumes:
      - ./conf.yml:/etc/docker-tools/conf.yml:ro
    networks:
      - tools-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  tools-network:
    name: docker-tools-network
    driver: bridge
