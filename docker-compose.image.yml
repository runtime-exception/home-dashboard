# 镜像部署版 compose —— 直接拉取 CI 构建好的镜像运行，
# 本机不需要任何构建环境（不需要 Node、不需要 npm、不需要 frontend/ 和 api/ 源码）。
#
# 镜像是「nginx + api」合并后的单镜像，由 .github/workflows/docker.yml 在每次 push 到 main 时
# 构建并推送到 GHCR。GHCR 上这个包是 public，pull 不需要 docker login。
# 镜像为多平台产物（linux/amd64 + linux/arm64），Apple Silicon 与 x86 服务器都能直接跑。
#
# 用法：
#   docker compose -f docker-compose.image.yml pull        # 拉取（可选，up 时会自动拉）
#   docker compose -f docker-compose.image.yml up -d
#   docker compose -f docker-compose.image.yml logs -f
#
# 部署前需要准备好（镜像里不含这些，属于运行时数据）：
#   1. .env            —— 必需。至少要 ADMIN_USERNAME 和 ADMIN_TOKEN（令牌至少 8 位）。
#                        缺任一项 compose 会在启动容器前直接报错。
#   2. config/conf.yml —— 必需。配置真源，由 api 读写。可先从仓库拷一份。
#   3. data/           —— 建议先 mkdir -p data，用于存放配置备份。
#
# 想固定版本而不是跟随 latest，把下面的 tag 换成具体版本（例如 :1.0.0）即可。

name: docker-tools-dashboard

services:
  app:
    image: ghcr.io/runtime-exception/home-dashboard:latest
    restart: unless-stopped
    # 用 tini 做 PID 1：回收僵尸进程，并把 docker stop 的信号转发给 entrypoint
    init: true
    ports:
      - "${DASHBOARD_PORT:-8080}:80"
    environment:
      # :? 语法让变量缺失时 compose 直接报错，避免出现空凭据的裸奔实例。
      # 凭据只从 .env（或 shell 环境）读取，绝不要在文件里写死默认值。
      ADMIN_USERNAME: "${ADMIN_USERNAME:?缺少 ADMIN_USERNAME，请在 .env 中设置}"
      ADMIN_TOKEN: "${ADMIN_TOKEN:?缺少 ADMIN_TOKEN，请在 .env 中设置（至少 8 位）}"
      SESSION_TTL_HOURS: "${SESSION_TTL_HOURS:-8}"
      CONFIG_FILE: /etc/docker-tools/conf.yml
      BACKUP_DIR: /data/backups
      # api 只监听容器内的回环地址，由同一容器里的 nginx 代理过去。
      # 端口不对外发布，容器网络里其他容器也连不上它。
      HOST: 127.0.0.1
      PORT: "3000"
      # api 进程以这个 uid:gid 运行（容器本身是 root，仅供 nginx 绑定 80），
      # 这样写回 conf.yml 与备份后，宿主机上的文件属主不会变成 root。
      # 首次部署前请先执行：mkdir -p data
      APP_UID: "${UID:-1000}"
      APP_GID: "${GID:-1000}"
    volumes:
      # 挂目录而不是挂单个文件：单文件 bind mount 会把 inode 钉住，
      # 导致容器内 rename 失败（原子写不可用），且宿主机换 inode 的编辑器改动看不到
      - ./config:/etc/docker-tools:rw
      - ./data:/data:rw
    # 只有一个容器，本可以不建自定义网络；但 nginx.conf 里用了
    # resolver 127.0.0.11（Docker 内置 DNS），它只在自定义网络里存在，
    # 所以保留这条网络，避免 nginx 在默认 bridge 下解析失败。
    networks:
      - tools-network
    healthcheck:
      # nginx（80）与 api（3000）都活着才算健康
      test:
        - CMD-SHELL
        - wget -q --spider http://127.0.0.1/healthz && wget -q --spider http://127.0.0.1:3000/healthz
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  tools-network:
    name: docker-tools-network
    driver: bridge
