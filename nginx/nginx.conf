user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 512m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    server {
        listen 80;
        server_name _;

        # Docker 内置 DNS。用变量式 proxy_pass 做运行时解析，
        # 这样 api 容器未就绪时 nginx 依然能启动，不会因此起不来。
        resolver 127.0.0.11 ipv6=off valid=30s;

        # 注意：变量式 proxy_pass 有两个坑
        #   1. 不会自动追加 URI —— 必须显式带上 $request_uri
        #   2. 不会自动设置 Host —— 必须手写，且要用 $proxy_host
        #      （$host 是浏览器发来的 ip:port，会打乱上游的 Host 判断）

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location /assets/ {
            root /usr/share/nginx/html;
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # ── 控制台接口 ────────────────────────────────────────────
        location /api/admin/ {
            set $api_upstream "http://api:3000";
            proxy_pass $api_upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $proxy_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            # 导入 YAML、恢复备份这类操作会慢一些
            proxy_read_timeout 30s;
            # 覆盖全局的 512m，配置文件不该有 512MB
            client_max_body_size 2m;
        }

        # ── 前端配置（由 api 在内存中生成，磁盘上没有这个文件）────
        location = /api/config.json {
            set $api_upstream "http://api:3000";
            proxy_pass $api_upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $proxy_host;
            proxy_set_header Connection "";
            access_log off;
        }

        # ── 工具在线状态 ──────────────────────────────────────────
        # 拆成「精确 + 带斜杠前缀」两条：写成 location /api/health
        # 会连 /api/healthz 一起匹配掉。
        location = /api/health {
            set $api_upstream "http://api:3000";
            proxy_pass $api_upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $proxy_host;
            proxy_set_header Connection "";
            proxy_read_timeout 15s;
            access_log off;
        }

        location /api/health/ {
            set $api_upstream "http://api:3000";
            proxy_pass $api_upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $proxy_host;
            proxy_set_header Connection "";
            proxy_read_timeout 15s;
            access_log off;
        }

        location / {
            root /usr/share/nginx/html;
            index index.html;
            # hash 路由下浏览器只请求 /，这条 fallback 足以覆盖深链刷新
            try_files $uri $uri/ /index.html;
        }

        location = /index.html {
            root /usr/share/nginx/html;
            add_header Cache-Control "no-store";
        }
    }
}
